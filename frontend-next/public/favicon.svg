<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Brand Colors: Desert #C9AD82, Charcoal #20282C -->
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9AD82"/>
      <stop offset="100%" stop-color="#B89A6E"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#20282C"/>
  <!-- Interconnected Circles Icon -->
  <g transform="translate(4, 4)">
    <!-- Circle 1 (top-left) -->
    <circle cx="8" cy="8" r="6" fill="none" stroke="url(#favGrad)" stroke-width="1.8"/>
    <!-- Circle 2 (top-right) -->
    <circle cx="14" cy="8" r="5" fill="none" stroke="url(#favGrad)" stroke-width="1.8"/>
    <!-- Circle 3 (bottom) -->
    <circle cx="11" cy="15" r="6" fill="none" stroke="url(#favGrad)" stroke-width="1.8"/>
  </g>
</svg>
