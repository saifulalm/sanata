<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon container with shadow -->
  <g filter="url(#shadow)">
    <!-- Background rounded rect -->
    <rect x="4" y="4" width="52" height="52" rx="12" fill="#0f172a" opacity="0.05"/>

    <!-- Main building shape with gradient -->
    <g filter="url(#glowEffect)">
      <!-- Shadow/fill layer -->
      <path d="M12 10 L26 10 L26 34 L42 34 L42 50 L12 50 Z" fill="url(#mainGradient)" opacity="0.15"/>
      <!-- Main stroke -->
      <path d="M10 10 L24 10 L24 32 L40 32 L40 50 L10 50 Z" fill="none" stroke="url(#mainGradient)" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Construction detail lines -->
      <line x1="10" y1="18" x2="24" y2="18" stroke="url(#mainGradient)" stroke-width="1.5" opacity="0.8"/>
      <line x1="24" y1="40" x2="40" y2="40" stroke="url(#mainGradient)" stroke-width="1.5" opacity="0.8"/>
      <line x1="10" y1="46" x2="40" y2="46" stroke="url(#mainGradient)" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Accent golden dot -->
    <circle cx="30" cy="14" r="3" fill="#f59e0b"/>
  </g>

  <!-- Brand text -->
  <text x="68" y="28" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="0.08em">SANTRA</text>
  <text x="70" y="46" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.15em">CONSTRUCTION</text>
</svg>
