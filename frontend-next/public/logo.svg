<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Brand Colors: Desert #C9AD82, Charcoal #20282C -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9AD82"/>
      <stop offset="100%" stop-color="#B89A6E"/>
    </linearGradient>
  </defs>

  <!-- Icon: Interconnected Circles -->
  <g transform="translate(8, 6)">
    <!-- Circle 1 (top-left) -->
    <circle cx="14" cy="14" r="12" fill="none" stroke="#C9AD82" stroke-width="2.5"/>
    <!-- Circle 2 (top-right) -->
    <circle cx="26" cy="14" r="10" fill="none" stroke="#C9AD82" stroke-width="2.5"/>
    <!-- Circle 3 (bottom) -->
    <circle cx="20" cy="28" r="11" fill="none" stroke="#C9AD82" stroke-width="2.5"/>
    <!-- Connection points (intersection highlights) -->
    <circle cx="18" cy="16" r="2" fill="#C9AD82"/>
    <circle cx="24" cy="20" r="2" fill="#C9AD82"/>
    <circle cx="16" cy="24" r="2" fill="#C9AD82"/>
  </g>

  <!-- Brand text -->
  <text x="68" y="28" font-family="'Avenir', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#20282C" letter-spacing="0.08em">SANATA</text>
  <text x="70" y="46" font-family="'Avenir', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.15em">YOUR BUILDING PARTNER</text>
</svg>
