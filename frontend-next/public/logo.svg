<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Gradient for icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Abstract geometric "S" combined with building/construction elements -->
  <g filter="url(#glow)">
    <!-- Main structure - stylized building/S shape -->
    <path d="M12 8 L24 8 L24 28 L36 28 L36 52 L12 52 Z" fill="url(#iconGradient)" opacity="0.3"/>
    <path d="M8 8 L20 8 L20 24 L32 24 L32 52 L8 52 Z" fill="none" stroke="url(#iconGradient)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Construction detail lines -->
    <line x1="8" y1="20" x2="20" y2="20" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.8"/>
    <line x1="20" y1="36" x2="32" y2="36" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.8"/>
    <line x1="8" y1="44" x2="32" y2="44" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.8"/>

    <!-- Accent dot -->
    <circle cx="26" cy="12" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Brand text -->
  <text x="48" y="28" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.08em">SANATA</text>
  <text x="50" y="46" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" letter-spacing="0.15em">CONSTRUCTION</text>
</svg>
