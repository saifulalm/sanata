<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0f172a" opacity="0.05"/>

  <!-- Icon with shadow -->
  <g filter="url(#iconShadow)">
    <g filter="url(#iconGlow)">
      <!-- Fill layer -->
      <path d="M10 8 L22 8 L22 22 L32 22 L32 34 L10 34 Z" fill="url(#iconGrad)" opacity="0.2"/>
      <!-- Main shape -->
      <path d="M8 8 L20 8 L20 20 L30 20 L30 34 L8 34 Z" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Construction lines -->
      <line x1="8" y1="14" x2="20" y2="14" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.8"/>
      <line x1="20" y1="26" x2="30" y2="26" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.8"/>
      <line x1="8" y1="30" x2="30" y2="30" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Accent dot -->
    <circle cx="24" cy="11" r="2.5" fill="#f59e0b"/>
  </g>
</svg>
