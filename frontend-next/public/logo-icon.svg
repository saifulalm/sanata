<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="36" height="36" rx="8" fill="#0c1829" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

  <!-- Icon: Abstract geometric structure -->
  <g filter="url(#glow)">
    <path d="M8 6 L18 6 L18 22 L28 22 L28 34 L8 34 Z" fill="url(#iconGradient)" opacity="0.25"/>
    <path d="M6 6 L16 6 L16 20 L26 20 L26 34 L6 34 Z" fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linejoin="round"/>

    <!-- Construction lines -->
    <line x1="6" y1="14" x2="16" y2="14" stroke="url(#iconGradient)" stroke-width="1.2" opacity="0.7"/>
    <line x1="16" y1="26" x2="26" y2="26" stroke="url(#iconGradient)" stroke-width="1.2" opacity="0.7"/>
    <line x1="6" y1="30" x2="26" y2="30" stroke="url(#iconGradient)" stroke-width="1.2" opacity="0.7"/>

    <!-- Accent dot -->
    <circle cx="20" cy="10" r="2" fill="#f59e0b"/>
  </g>
</svg>
