<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <!-- Brand Colors: Desert #C9AD82, Charcoal #20282C -->
    <linearGradient id="iconBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9AD82"/>
      <stop offset="100%" stop-color="#B89A6E"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="#20282C" stroke-width="1" opacity="0.1"/>

  <!-- Icon: Interconnected Circles -->
  <g transform="translate(4, 4)">
    <!-- Circle 1 (top-left) -->
    <circle cx="10" cy="10" r="8" fill="none" stroke="#C9AD82" stroke-width="2"/>
    <!-- Circle 2 (top-right) -->
    <circle cx="18" cy="10" r="7" fill="none" stroke="#C9AD82" stroke-width="2"/>
    <!-- Circle 3 (bottom) -->
    <circle cx="14" cy="20" r="8" fill="none" stroke="#C9AD82" stroke-width="2"/>
    <!-- Connection points -->
    <circle cx="12" cy="11" r="1.5" fill="#C9AD82"/>
    <circle cx="17" cy="14" r="1.5" fill="#C9AD82"/>
    <circle cx="11" cy="17" r="1.5" fill="#C9AD82"/>
  </g>
</svg>
