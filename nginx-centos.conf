# ================================================================
# SANATA CONSTRUCTION - CentOS Nginx Configuration
# For production server running on CentOS
# ================================================================

# Upstream definitions - Node.js apps
upstream sanata_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream sanata_frontend {
    server 127.0.0.1:5001;
    keepalive 64;
}

# ================================================================
# HTTP -> HTTPS Redirect (All domains)
# ================================================================
server {
    listen 80;
    listen [::]:80;
    server_name sanata.id www.sanata.id api.sanata.id;

    # ACME challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect everything else to HTTPS
    return 301 https://$host$request_uri;
}

# ================================================================
# API Server - Express.js Backend
# Domain: api.sanata.id
# ================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sanata.id;

    # SSL paths - PASTIKAN FILE INI ADA
    # Let's Encrypt: /etc/letsencrypt/live/sanata.id/
    # Self-signed: /etc/nginx/ssl/
    ssl_certificate /etc/letsencrypt/live/sanata.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanata.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sanata.id/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (enable setelah SSL working)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/sanata-api-access.log;
    error_log  /var/log/nginx/sanata-api-error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # Main API proxy
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://sanata_backend;
    }

    # Auth - stricter rate limit
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://sanata_backend;
    }

    # Static files - uploads
    location /uploads/ {
        alias /var/www/sanata/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # WebSocket
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://sanata_backend;
    }

    server_tokens off;
    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ================================================================
# Main Website - Next.js Frontend
# Domain: sanata.id, www.sanata.id
# ================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanata.id www.sanata.id;

    root /var/www/sanata/frontend-next;

    # SSL
    ssl_certificate /etc/letsencrypt/live/sanata.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanata.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sanata.id/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/sanata-web-access.log;
    error_log  /var/log/nginx/sanata-web-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-javascript text/javascript image/svg+xml;

    # Next.js static assets
    location /_next/static/ {
        alias /var/www/sanata/frontend-next/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public files
    location /public/ {
        alias /var/www/sanata/frontend-next/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/sanata/frontend-next/public/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # API proxy
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://sanata_backend;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://sanata_backend;
    }

    # Main - proxy to Next.js
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://sanata_frontend;
    }

    # WebSocket
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://sanata_backend;
    }

    server_tokens off;
    charset utf-8;

    location = /robots.txt { access_log off; log_not_found off; }
}
